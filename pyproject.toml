[project]
name = "omgsr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.49.0",
    "deepspeed>=0.18.3",
    "diffusers>=0.36.0",
    "lightning>=2.6.0",
    "omegaconf>=2.3.0",
    "opencv-python>=4.12.0.88",
    "peft>=0.18.0",
    "scikit-image>=0.26.0",
    "scipy>=1.16.3",
    "torchmetrics[image]>=1.3.0",
    "transformers>=4.57.3",
    "wandb>=0.23.1",
]

[project.optional-dependencies]
# Select exactly one of these when creating/syncing the env:
#   uv sync --extra cu128
#   uv sync --extra cu130
cu128 = [
  "torch>=2.9.1",
  "torchvision>=0.24.1",
]
cu130 = [
  "torch>=2.9.1",
  "torchvision>=0.24.1",
]

cpu = [
  "torch>=2.9.1",
  "torchvision>=0.24.1",
]

[tool.uv]
conflicts = [
  [
    { extra = "cu130" },
    { extra = "cu128" },
    { extra = "cpu" },
  ],
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cpu", extra = "cpu" },
]
torchvision = [
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cpu", extra = "cpu" },
]

