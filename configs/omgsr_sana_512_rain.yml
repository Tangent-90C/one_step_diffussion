model: omgsr_sana_512
seed: 123
model_path: /mnt/HDD-data/jianuo/models/Sana_Sprint_1.6B_1024px_diffusers
fixed_prompt: ""   # empty prompt is ok!
fixed_prompt_path: null
dataset_txt_or_dir_paths: ['/home/chenjn/OMGSR/gtrain_pairs.csv']
val_dataset_txt_or_dir_paths: ['/home/chenjn/OMGSR/gtrain_pairs_val.csv']
val_batch_size: 2
val_check_interval: 1000
val_sample_enabled: True
val_sample_ratio: 1
val_sample_max: 500 # 抽样检测的最大图片数量
val_sample_seed: 123
val_log_num_images: 8

vae_lora_rank: 64
transformer_lora_rank: 64

dinov3_convnext_size: large      # tiny, small, base, large
dinov3_repo_path: dinov3_gan/facebookresearch_dinov3_main            # 可选：本地 DINOv3 仓库路径（默认使用 dinov3_gan/facebookresearch_dinov3_main）
dinov3_weights_path: dinov3_gan/dinov3_weights/         # 可选：本地权重 .pth 路径（默认使用 dinov3_gan/dinov3_weights/ 里的对应权重）
torch_home: /mnt/HDD-data/jianuo/models/torch_cache                  # 可选：Torch Hub/torchvision 权重缓存目录（影响 FID/KID 的 Inception 权重）
lambda_LRR: 5
lambda_Dv3D: 5
lambda_L1: 0.5
lambda_GAN: 0.5
mid_timestep: 244 

output_dir: ./omgsr_trainings/omgsr_sana_512_rain2
resolution: 512
train_batch_size: 1
max_epochs: 10                     # 训练 epoch 数（Trainer 用这个控制总训练轮数）
train_epoch_augment_multiplier: 1.0  # 训练集随机增强的“等效倍数”，>1 会增加每个 epoch 的步数
max_steps_per_epoch: 100000         # 每个 epoch 最大步数上限（根据数据量计算后再取 min）
checkpointing_steps: 500
save_img_steps: 500
save_img_to_wandb: True
resume_from_checkpoint: null
gradient_accumulation_steps: 4
gradient_checkpointing: True
enable_xformers_memory_efficient_attention: False
learning_rate: 5e-5
lr_scheduler: constant
lr_warmup_steps: 500
lr_num_cycles: 1
lr_power: 1.0
dataloader_num_workers: 4
use_8bit_adam: False
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1e-4
adam_epsilon: 1e-08
max_grad_norm: 1.0
logging_dir: logs
allow_tf32: False
mixed_precision: bf16
